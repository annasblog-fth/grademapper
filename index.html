<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>grademapper</title>
  <meta name="description" content="grademapper: a cute, simple grade tracker that tells you what you need on your next test. Works offline. No account.">
  <meta name="theme-color" content="#F7F4EA">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="grademapper">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <noscript><style>#shell, #lock { display: none; }</style></noscript>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <div id="shell" hidden>
    <header class="topbar">
      <a class="brand" href="#/home"><span class="logo" aria-hidden="true">GM</span><span>grademapper</span></a>
      <button type="button" id="tools-btn" class="tools-btn" aria-expanded="false" aria-controls="tools-panel"><span>Tools</span></button>
    </header>
    <!-- Tools panel: top-right, floats above whichever page is open -->
    <section id="tools-panel" class="tools-panel" role="region" aria-labelledby="tools-title" hidden>
      <div class="panel-head">
        <button type="button" id="tools-back" class="panel-btn" hidden></button>
        <h2 id="tools-title" tabindex="-1">Tools</h2>
        <button type="button" id="tools-close" class="panel-btn"></button>
      </div>
      <div id="tools-body" class="panel-body"></div>
    </section>
    <main id="main"><div id="view" tabindex="-1"></div></main>
    <nav id="nav" aria-label="Main"></nav>
    <!-- Small popup shown while a tool is in use (timer, sound, recording, reading aloud) -->
    <div id="tool-popup" class="tool-popup" role="region" aria-label="Tools in use" hidden></div>
  </div>

  <div id="lock" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:1rem">grademapper needs JavaScript to run. Please turn it on in your browser.</p></noscript>

  <script src="js/engine.js"></script>
  <script src="js/util.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/grades.js"></script>
  <script src="js/pages/welcome.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/activities.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/tools.js"></script>
  <script src="js/pages/tools-media.js"></script>
  <script src="js/pages/archive.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/dock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
